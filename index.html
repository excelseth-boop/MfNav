<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mutual Fund NAV Downloader</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8e9ec;
    padding-bottom: 40px;
  }
  header {
    padding: 18px 16px 14px 16px;
    background: linear-gradient(135deg, #1b1f2a, #12141a);
    border-bottom: 1px solid #262a35;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 {
    margin: 0 0 4px 0;
    font-size: 19px;
    font-weight: 700;
  }
  .sub {
    margin: 0;
    font-size: 12.5px;
    color: #9aa0ac;
  }
  .bar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  input[type="text"] {
    flex: 1;
    font-size: 16px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #2c313d;
    background: #181b23;
    color: #e8e9ec;
    outline: none;
  }
  input[type="text"]:focus { border-color: #4f8cff; }
  button {
    font-size: 14px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary { background: #4f8cff; color: #fff; }
  .btn-primary:disabled { background: #2c3444; color: #6c7280; }
  .btn-ghost { background: #1e2128; color: #cfd3da; border: 1px solid #2c313d; }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #cfd3da;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid #2c313d;
    background: #181b23;
  }
  .toggle input { width: 16px; height: 16px; }
  .status {
    padding: 10px 16px;
    font-size: 13px;
    color: #9aa0ac;
  }
  .status.error { color: #ff6b6b; }
  .status.ok { color: #57d38c; }
  select {
    font-size: 14px;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid #2c313d;
    background: #181b23;
    color: #e8e9ec;
  }
  .count-pill {
    display: inline-block;
    background: #1e2128;
    border: 1px solid #2c313d;
    color: #9aa0ac;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  thead th {
    position: sticky;
    top: 152px;
    background: #12141a;
    text-align: left;
    padding: 8px 10px;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #7a8090;
    border-bottom: 1px solid #262a35;
  }
  tbody td {
    padding: 9px 10px;
    border-bottom: 1px solid #1b1e26;
    vertical-align: top;
  }
  tbody tr:active { background: #171a21; }
  .scheme-name { color: #e8e9ec; }
  .fund-house { color: #7a8090; font-size: 11.5px; margin-top: 2px; }
  .nav-val { font-weight: 700; color: #57d38c; white-space: nowrap; }
  .code { color: #5c6270; font-size: 11px; }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: #6c7280;
    font-size: 14px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #2c313d;
    border-top-color: #4f8cff;
    border-radius: 50%;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>Mutual Fund NAV Downloader</h1>
  <p class="sub" id="asOf">Current NAV for every Indian mutual fund scheme, sourced from AMFI.</p>
  <div class="bar">
    <input type="text" id="searchBox" placeholder="Search scheme name, AMC, or code..." disabled>
    <select id="amcFilter" disabled>
      <option value="">All AMCs</option>
    </select>
  </div>
  <div class="actions">
    <button class="btn-primary" id="loadBtn">Fetch Latest NAVs</button>
    <button class="btn-ghost" id="csvBtn" disabled>Download CSV</button>
    <label class="toggle"><input type="checkbox" id="activeOnly" checked>Active schemes only</label>
    <span class="count-pill" id="countPill" style="display:none"></span>
  </div>
</header>

<div class="status" id="status">Tap "Fetch Latest NAVs" to load current data.</div>

<table id="navTable" style="display:none">
  <thead>
    <tr>
      <th>Scheme</th>
      <th style="text-align:right">NAV (₹)</th>
    </tr>
  </thead>
  <tbody id="navBody"></tbody>
</table>

<div class="empty" id="emptyMsg" style="display:none">No schemes match your search.</div>

<script>
(function () {
  "use strict";

  // Open, no-auth data API that republishes AMFI's daily NAV filings as clean,
  // browser-fetchable CSV. One row per scheme, always the latest published NAV.
  // No CORS proxy needed - this endpoint is served with CORS enabled.
  var DATA_URL = "https://api.tigzig.com/mf/v1/download?format=latest";

  var allRows = [];      // {code, isin1, isin2, name, amc, nav, date, active}
  var amcSet = [];
  var searchBox = document.getElementById("searchBox");
  var amcFilter = document.getElementById("amcFilter");
  var loadBtn = document.getElementById("loadBtn");
  var csvBtn = document.getElementById("csvBtn");
  var activeOnly = document.getElementById("activeOnly");
  var statusEl = document.getElementById("status");
  var tableEl = document.getElementById("navTable");
  var bodyEl = document.getElementById("navBody");
  var emptyMsg = document.getElementById("emptyMsg");
  var countPill = document.getElementById("countPill");
  var asOfEl = document.getElementById("asOf");

  function setStatus(msg, cls) {
    statusEl.className = "status" + (cls ? " " + cls : "");
    statusEl.innerHTML = msg;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // Proper CSV parser: handles quoted fields with embedded commas/quotes/newlines,
  // since scheme names sometimes contain commas.
  function parseCsv(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    var i, c, next;

    for (i = 0; i < text.length; i++) {
      c = text.charAt(i);
      if (inQuotes) {
        if (c === "\"") {
          next = text.charAt(i + 1);
          if (next === "\"") { field += "\""; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if (c === "\"") {
          inQuotes = true;
        } else if (c === ",") {
          row.push(field); field = "";
        } else if (c === "\n") {
          row.push(field); field = "";
          rows.push(row); row = [];
        } else if (c === "\r") {
          // skip, \n handles the row break
        } else {
          field += c;
        }
      }
    }
    if (field.length > 0 || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows;
  }

  function buildRows(csvRows) {
    if (csvRows.length < 2) { return { rows: [], amcs: [] }; }
    var header = csvRows[0];
    var idx = {};
    var i;
    for (i = 0; i < header.length; i++) { idx[header[i].trim()] = i; }

    var need = ["scheme_code", "isin", "isin2", "scheme_name", "amc", "nav_date", "nav", "is_active"];
    for (i = 0; i < need.length; i++) {
      if (!(need[i] in idx)) { throw new Error("Unexpected data format (missing " + need[i] + ")"); }
    }

    var rows = [];
    var amcs = {};
    for (i = 1; i < csvRows.length; i++) {
      var r = csvRows[i];
      if (r.length < header.length) { continue; }
      var name = (r[idx.scheme_name] || "").trim();
      var code = (r[idx.scheme_code] || "").trim();
      var navStr = (r[idx.nav] || "").trim();
      if (!name || !code || navStr === "") { continue; }
      var navNum = parseFloat(navStr);
      if (isNaN(navNum)) { continue; }
      var amc = (r[idx.amc] || "Unknown").trim() || "Unknown";

      rows.push({
        code: code,
        isin1: (r[idx.isin] || "").trim(),
        isin2: (r[idx.isin2] || "").trim(),
        name: name,
        amc: amc,
        nav: navNum,
        date: (r[idx.nav_date] || "").trim(),
        active: (r[idx.is_active] || "").trim().toLowerCase() === "true"
      });
      amcs[amc] = true;
    }
    return { rows: rows, amcs: Object.keys(amcs).sort() };
  }

  function renderTable(rows) {
    if (rows.length === 0) {
      tableEl.style.display = "none";
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";
    tableEl.style.display = "table";

    var html = "";
    var max = Math.min(rows.length, 2000); // render cap for smooth scrolling; download still exports all matches
    for (var i = 0; i < max; i++) {
      var r = rows[i];
      html += "<tr>" +
        "<td><div class=\"scheme-name\">" + escapeHtml(r.name) + "</div>" +
        "<div class=\"fund-house\">" + escapeHtml(r.amc) + " &middot; <span class=\"code\">Code " + escapeHtml(r.code) + "</span></div></td>" +
        "<td class=\"nav-val\" style=\"text-align:right\">" + r.nav.toFixed(4) + "</td>" +
        "</tr>";
    }
    bodyEl.innerHTML = html;
    if (rows.length > max) {
      countPill.textContent = rows.length + " matches (showing first " + max + ")";
    } else {
      countPill.textContent = rows.length + " schemes";
    }
    countPill.style.display = "inline-block";
  }

  function getFiltered() {
    var q = searchBox.value.trim().toLowerCase();
    var amc = amcFilter.value;
    var onlyActive = activeOnly.checked;
    return allRows.filter(function (r) {
      if (onlyActive && !r.active) { return false; }
      if (amc && r.amc !== amc) { return false; }
      if (!q) { return true; }
      return r.name.toLowerCase().indexOf(q) !== -1 ||
             r.amc.toLowerCase().indexOf(q) !== -1 ||
             r.code.indexOf(q) !== -1;
    });
  }

  function applyFilters() {
    renderTable(getFiltered());
  }

  function toCsvValue(v) {
    var s = String(v == null ? "" : v);
    if (s.indexOf(",") !== -1 || s.indexOf("\"") !== -1 || s.indexOf("\n") !== -1) {
      s = "\"" + s.replace(/"/g, "\"\"") + "\"";
    }
    return s;
  }

  function downloadCsv() {
    var rows = getFiltered();
    var header = ["Scheme Code", "Scheme Name", "Fund House", "NAV", "Date", "ISIN Growth/Payout", "ISIN Reinvestment", "Active"];
    var lines = [header.join(",")];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      lines.push([
        toCsvValue(r.code),
        toCsvValue(r.name),
        toCsvValue(r.amc),
        toCsvValue(r.nav.toFixed(4)),
        toCsvValue(r.date),
        toCsvValue(r.isin1),
        toCsvValue(r.isin2),
        toCsvValue(r.active ? "Yes" : "No")
      ].join(","));
    }
    var csvText = lines.join("\n");
    var blob = new Blob([csvText], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "mutual_fund_nav_" + stamp + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function populateAmcFilter(amcs) {
    var html = "<option value=\"\">All AMCs (" + amcs.length + ")</option>";
    for (var i = 0; i < amcs.length; i++) {
      html += "<option value=\"" + escapeHtml(amcs[i]) + "\">" + escapeHtml(amcs[i]) + "</option>";
    }
    amcFilter.innerHTML = html;
  }

  function loadData() {
    loadBtn.disabled = true;
    loadBtn.innerHTML = "<span class=\"spinner\"></span>Fetching...";
    setStatus("Fetching latest NAV data, this can take a few seconds...");
    tableEl.style.display = "none";
    emptyMsg.style.display = "none";
    countPill.style.display = "none";

    fetch(DATA_URL, { cache: "no-store" })
      .then(function (resp) {
        if (!resp.ok) { throw new Error("HTTP " + resp.status); }
        return resp.text();
      })
      .then(function (text) {
        var csvRows = parseCsv(text);
        var built = buildRows(csvRows);
        if (built.rows.length === 0) {
          throw new Error("Could not parse any scheme rows from the response.");
        }
        allRows = built.rows;
        amcSet = built.amcs;
        populateAmcFilter(amcSet);
        searchBox.disabled = false;
        amcFilter.disabled = false;
        csvBtn.disabled = false;

        var activeCount = allRows.filter(function (r) { return r.active; }).length;
        var latestDate = "";
        for (var i = 0; i < allRows.length; i++) {
          if (allRows[i].date && allRows[i].date > latestDate) { latestDate = allRows[i].date; }
        }
        asOfEl.textContent = activeCount + " active schemes (" + allRows.length + " total incl. matured) across " +
          amcSet.length + " AMCs \u00b7 latest NAV date " + latestDate;
        setStatus("Loaded successfully.", "ok");
        applyFilters();
      })
      .catch(function (err) {
        setStatus("Couldn't load NAV data: " + err.message + ". Try again, or check your connection.", "error");
      })
      .then(function () {
        loadBtn.disabled = false;
        loadBtn.textContent = "Refresh NAVs";
      });
  }

  loadBtn.addEventListener("click", loadData);
  csvBtn.addEventListener("click", downloadCsv);
  searchBox.addEventListener("input", applyFilters);
  amcFilter.addEventListener("change", applyFilters);
  activeOnly.addEventListener("change", applyFilters);
})();
</script>
</body>
</html>
